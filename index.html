
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WalaBox | Premium Creative Hub</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📦</text></svg>">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --cubic: cubic-bezier(0.4, 0, 0.2, 1);
    }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f1f5f9;
      overflow-x: hidden;
      color: #0f172a;
    }
    .glass-effect {
      background: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.3);
    }
    .preserve-3d {
      transform-style: preserve-3d;
    }
    .perspective-3000 {
      perspective: 3000px;
    }
    .cubic-bezier {
      transition-timing-function: var(--cubic);
    }
    
    /* Hide scrollbar */
    ::-webkit-scrollbar {
      width: 0px;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      33% { transform: translateY(-25px) rotate(1deg); }
      66% { transform: translateY(-10px) rotate(-1deg); }
    }
    .animate-float {
      animation: float 8s ease-in-out infinite;
    }
    
    /* Shadow pulse for floating effect */
    @keyframes shadow-pulse {
      0%, 100% { transform: scale(1); opacity: 0.2; blur: 40px; }
      50% { transform: scale(0.85); opacity: 0.1; blur: 60px; }
    }
    .shadow-float {
      animation: shadow-pulse 8s ease-in-out infinite;
    }
  </style>
<script type="importmap">

  }
}
</script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="index.tsx"></script>
</body>
</html>
